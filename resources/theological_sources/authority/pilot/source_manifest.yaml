# NAE Metadata Manifest Pilot (Schema v2.1.0) — NAE-METADATA-PILOT-001
# Pilot 검증용 — 기존 resources/theological_sources/baptist/source_manifest.yaml을
# 덮어쓰지 않음. 이 파일은 별도 pilot 트리(authority/pilot/)에만 존재하며
# 실제 검색/파이프라인에서 참조되지 않는다(운영 Manifest와 구분 —
# NAE_PILOT_MANIFEST_FIX_REPORT_001.md §3 Filename Policy 참고).
#
# 2026-08-02 개정(NAE-PILOT-MANIFEST-FIX-001):
#   - 파일명을 manifest_pilot.yaml → source_manifest.yaml로 변경 —
#     scripts/source_validator.py가 MANIFEST_FILENAME="source_manifest.yaml"만
#     rglob으로 탐색하므로, 이전 파일명은 validator 대상에서 아예 누락되어
#     있었다(검증 자체가 실행되지 않음). 디렉토리 경로(authority/pilot/)가
#     이미 운영 데이터와의 구분 역할을 하므로 파일명은 표준을 따른다.
#   - access_control 필드 추가(v2.1.0 필수 필드 중 누락되어 있었음)
#   - schema_version을 2.0.0 → 2.1.0으로 갱신(ADR-016 반영 스키마와 일치)
