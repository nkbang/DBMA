# NAE-SOURCE-003 — Baptist Source Registry manifest
# 스키마: resources/theological_sources/source_manifest.schema.yaml (v1.1)
# 입력: resources/theological_sources/baptist/source_candidates.csv
#
# 이 파일은 등록(manifest 변환)만 수행한다 — 원문 파일은 아직 확보되지
# 않았으며(local_path: null), 실제 다운로드는 이 작업 범위 밖이다.
#
# tradition/theological_category 매핑은 CSV의 원 tradition 표기가
# "Particular Baptist / American Baptist / Baptist Evangelical" 3분류와
# 정확히 1:1 대응하지 않아 신학사적 판단을 거쳐 배정했다 — 근거는 각
# 항목의 notes에 기록. docs/NAE_SOURCE_REGISTRY_REPORT.md §metadata 검토
# 참고, 최종 확정은 HQ 검토 필요.

schema_version: "1.2"

sources:
  # ── P0/P1 중 PD 확정 5건 — approved_for_acquisition ──────────────

  - source_id: SLBC1689
    title: "Second London Baptist Confession of Faith (1689)"
    author: "John Spurstow et al. (Baptist Assembly)"
    year: 1689
    license: public_domain_original
    content_genre: [confession]
    tradition: "Particular Baptist"
    theological_category: [confession, ecclesiology, soteriology]
    local_path: null
    status: approved_for_acquisition
    notes: >
      CSV priority=P0. tradition 매핑 근거: 영국 Particular(칼빈주의)
      침례교의 대표 신앙고백 원문 그 자체 — "Particular Baptist"로 직접
      매핑, 판단 여지 적음. 확보 후보 출처: Internet Archive, Project
      Gutenberg, CCEL (CSV source_location 그대로).

  - source_id: PBC1742
    title: "Philadelphia Baptist Confession (1742)"
    author: "Philadelphia Association of Baptist Churches"
    year: 1742
    license: public_domain_original
    content_genre: [confession]
    tradition: "American Baptist"
    theological_category: [confession, ecclesiology, soteriology]
    local_path: null
    status: approved_for_acquisition
    notes: >
      CSV priority=P0. tradition 매핑 근거: SLBC1689(1689 런던 고백)의
      신학은 계승하되, 미국 최초의 독자적 침례교 연합체(필라델피아
      Association)가 채택한 첫 미국 침례교 신앙고백이라는 역사적 지위를
      기준으로 "American Baptist"로 분류(신학적으로는 Particular Baptist
      계열과 사실상 동일 — 이 구분은 지리/역사 축, HQ 재검토 여지 있음).

  - source_id: NHBC1833
    title: "New Hampshire Confession of Faith (1833)"
    author: "New Hampshire Baptist Convention"
    year: 1833
    license: public_domain_original
    content_genre: [confession]
    tradition: "American Baptist"
    theological_category: [confession, soteriology, ecclesiology]
    local_path: null
    status: approved_for_acquisition
    aliases: [baptist-confession-001]
    notes: >
      [NAE-SOURCE-DEDUP-001, 2026-07-31] canonical id로 확정됨 —
      docs/SOURCE_ID_POLICY.md 참고. 이전 STEP4/STEP5 산출물
      (STEP4_PILOT_SOURCE_ENTRY.md, STEP5_SOURCE_REGISTRY_ENTRY.md 등)이
      쓰던 "baptist-confession-001"은 삭제하지 않고 alias로 보존 — 해당
      문서들은 수정하지 않으며, 향후 새로 작성되는 문서는 NHBC1833을
      사용한다.
      CSV priority=P0. tradition 매핑 근거: 미국 북부/서부 침례교에서
      널리 채택된 온건 칼빈주의 신앙고백 — 남침례교 BFM(2000, 아래
      BFM2000 항목)의 직접적 원형이기도 함. "American Baptist"로 분류.
      [2026-08-01] 원문 확보 시 두 경로 모두에 배치 필요 —
      docs/architecture/NAE-Dual-Pipeline-Clarification.md 참고:
      (A) NAE/pipeline용 NAE/corpus/raw/archive_org/books/NHBC1833/
      (ocr.txt/original.pdf/hocr.html, PBC1765 선례 형식),
      (B) core/tsu_builder.py 경로용 data/nae/sources/baptist/nhc_1833.txt
      (STEP5_HUMAN_ACQUISITION_GUIDE.md 형식). 현재 두 경로 모두 원문
      미확보 상태 — status는 approved_for_acquisition 유지.
      여부는 docs/NAE_SOURCE_REGISTRY_REPORT.md에서 별도 언급.

  - source_id: TH1612
    title: "A Short Declaration of the Mystery of Iniquity"
    author: "Thomas Helwys"
    year: 1612
    license: public_domain_original
    content_genre: [theology]
    tradition: "Baptist Evangelical"
    theological_category: [ecclesiology]
    local_path: null
    status: approved_for_acquisition
    notes: >
      CSV priority=P1. tradition 매핑 근거: Helwys는 최초의 English
      Baptist 회중을 창립한 General(초기, 아르미니안 성향) Baptist 지도자
      — Particular(칼빈주의)에도 American에도 속하지 않아, 남는 선택지
      "Baptist Evangelical"로 분류(종교의 자유를 설파한 초기 전도적 논고
      성격과도 부합). theological_category는 confession이 아닌 논고이므로
      confession 태그 제외, 정교분리·종교자유 주제상 ecclesiology만 부여.

  - source_id: AF1815
    title: "The Gospel Defended (and other theological works)"
    author: "Andrew Fuller"
    year: 1785
    license: public_domain_original
    content_genre: [theology]
    tradition: "Particular Baptist"
    theological_category: [soteriology, missions]
    local_path: null
    status: approved_for_acquisition
    notes: >
      CSV priority=P1, CSV tradition 원표기="Baptist (Particular/Revival)".
      Fuller는 신학적으로 Particular Baptist(칼빈주의) 계열이므로
      "Particular Baptist"로 매핑(부흥/선교 강조는 tradition이 아닌
      theological_category=missions로 반영). Baptist Missionary Society
      공동 설립자 — soteriology(복음 제시 논쟁, Fullerism)와
      missions(현대 선교운동 신학적 기초) 두 축 부여.

  # ── 저작권 제한 — 등록은 하되 permission_required ───────────────

  - source_id: BFM2000
    title: "Baptist Faith and Message 2000"
    author: "Southern Baptist Convention"
    year: 2000
    license: copyright_restricted
    content_genre: [confession]
    tradition: "American Baptist"
    theological_category: [confession, ecclesiology, soteriology]
    local_path: null
    status: permission_required
    notes: >
      CSV priority=P0, license=copyright_restricted(CSV 원문 그대로,
      public domain 아님). tradition="American Baptist"는 남침례교(SBC)가
      NHBC1833 계열을 현대화한 공식 교리문이라는 역사적 연속성 기준.
      status=permission_required로 등록만 하고 확보는 보류 — SBC/Ligonier
      등 권리 보유자의 별도 허가 검토 필요(CSV notes 동일 취지).

  # ── 데이터 신뢰성 미확인 — 등록은 하되 verification_pending ──────

  - source_id: JS1608
    title: "The Book of the First Baptist Church at Amsterdam (1608-1614)"
    author: "John Smyth"
    year: 1608
    license: public_domain_possible  # [2026-07-31 갱신] 아래 참고
    content_genre: [history, church_practice]
    tradition: "Baptist Evangelical"
    theological_category: [ecclesiology]
    local_path: null
    status: verification_pending
    notes: >
      [2026-07-31, C1-CORPUS-FIX-001 반영] source_candidates.csv의 이
      행은 원래 인용부호 없는 쉼표("Dutch" 값 등)로 CSV 컬럼이 밀려
      파싱되었으나(경위: docs/NAE_SOURCE_REGISTRY_REPORT.md), C1이
      language 컬럼을 "English, Dutch"로 큰따옴표 처리해 수정 완료 —
      재검증 결과 7행 전부 11개 필드 정상 정렬 확인됨. 이에 따라
      license를 CSV의 실제 값 "public_domain_possible"로 갱신(기존
      "unknown"은 컬럼 밀림으로 값을 신뢰할 수 없어 보수적으로
      기록했던 것). status는 여전히 verification_pending 유지 — CSV
      notes에 "Author died 1630. Verify Dutch copyright law (life + 70
      years = 1700)"라는 미해결 저작권 질문이 남아 있어, 데이터 정합성
      문제와 무관하게 네덜란드 저작권법 확인이 별도로 필요함.
