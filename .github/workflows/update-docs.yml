name: Update DBMA Docs

on:
  push:
    branches:
      - main
    paths:
      - "dbma.py"
      - "dbma_rag.py"
      - "core/**"
      - "ui/**"
      - "scripts/**"
      - "docs/**"
      - "requirements.txt"
      - "pyproject.toml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate docs
        run: |
          python3 scripts/update_docs.py

      - name: Show changes
        run: |
          git status --short
          git diff -- docs/ || true

      - name: Commit docs
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/
            git commit -m "docs: auto update DBMA docs"
            git push
          else
            echo "No doc changes to commit."
          fi
