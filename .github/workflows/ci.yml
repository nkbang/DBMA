name: DBMA CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          # libhunspell-dev: headers for the `hunspell` wheel in
          # requirements.txt (core/tli/hunspell_adapter.py — 설교 에디터
          # 맞춤법 검사). Without it the wheel build fails with
          # "fatal error: hunspell.hxx: No such file or directory".
          sudo apt-get update
          sudo apt-get install -y libhunspell-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run validation pipeline
        run: |
          python3 scripts/validate_pipeline.py --pytest-args "-v --tb=short" --benchmark-limit 2

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dbma-benchmark-results
          path: |
            output/bench/benchmark_results.csv
            output/bench/benchmark_summary.json
