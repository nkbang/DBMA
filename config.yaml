# config.yaml — DBMA 단일 설정 소스 (Source of Truth)

# ── App Metadata ────────────────────────────────────────
app:
  name: "DBMAr"
  version: "1.3.0"

language_settings:
  mode: "academic_theological"
  languages: ["ko", "en", "he", "el", "la"]
  parsing_instructions: >
    This is an academic theological document. It contains multilingual content 
    including Hebrew, Greek, and Latin. You must accurately transcribe 
    Hebrew characters, Greek diacritics, and Latin liturgical terms. 
    Preserve the integrity of all original language citations and academic formatting.

parsing_config:
  result_type: "markdown"
  num_workers: 1

# ── Directory Settings ──────────────────────────────────
directories:
  raw_dir: "data/RAW"
  # output_dir: 처리 결과물 저장 위치 (dbma.py / dbma_rag.py 에서 동적 로드)
  # 기존 호환성: data/제련완성본
  output_dir: "data/제련완성본"
  logs_dir: "logs"
  chroma_db_path: "chroma_db"
  # [ADR-031] 사용자 제공 성경 본문 JSON (개역개정 등). "연구하기 > 본문 해설"
  # 뷰어 전용 읽기 데이터 — TSU/검색 코퍼스와 무관. 파일이 없거나 형식이
  # 어긋나면 core/bible_text.py가 fail-closed 처리(뷰어가 안내만 표시).
  bible_text_path: "data/bible/knrv.json"
  # bench_dir: TSU dataset / benchmark 산출물 위치 (SPRINT17-Phase5-M1b-0.1)
  # 기존 호환성: output/bench (RetrievalEngine/build_tsu_dataset.py 기존 하드코딩과 동일 값)
  bench_dir: "output/bench"

# ── Chunking Defaults ──────────────────────────────────
chunking:
  default_size: 1200
  default_overlap: 120
  # [SPRINT29-B] Matches the actual minimum enforced by
  # core/chunking_optimizer.py (was declared 200 here but the code always
  # used 80 — reconciled to the real value, behavior unchanged).
  min_chunk_size: 80
  # [SPRINT29-B] Advisory only — not enforced by the chunker. The effective
  # upper bound is a soft cap of default_size * 1.5 in chunking_optimizer.py.
  max_chunk_size: 5000

# ── Vector Database (Primary) ──────────────────────────
# [NAE-2026-09-02] Qdrant가 실제 primary 벡터DB입니다. ChromaDB는 legacy
# corpus history로만 보존되며, 현재 검색 경로에서 쿼리되지 않습니다.
vector_db:
  primary: "qdrant"
  chroma:
    collection_name: "dbmar_docs"
    persist_directory: "chroma_db"
  qdrant:
    # ADR-013: nae_qdrant(호스트 포트 7333)는 NAE 전용 Independent Qdrant
    # Instance — DBMA 자체 Qdrant(docker-compose.yml의 `qdrant` 서비스,
    # container dbma_qdrant, 호스트 포트 6333)와는 별개 컨테이너·볼륨이다.
    # [2026-09-03] 한때 이 값을 7333(nae_qdrant)으로 돌려놓은 적이 있었으나,
    # 그건 "dbma_qdrant 컨테이너가 현재 안 떠 있어서 6333이 안 열려있다"는
    # 사실과 "그러니 DBMA를 NAE 인스턴스에 붙인다"는 결론을 혼동한 것 —
    # ADR-013의 격리를 깨뜨린다. DBMA용 dbma_qdrant를 띄우면 6333이 열린다.
    url: "http://localhost:6333"
    collections:
      sermon: "dbma_sermon"
      chunks: "dbma_chunks"

# ── Embedding Model ────────────────────────────────────
# LangChain 기반 임베딩 — legacy/폴백 전용 (기본 백엔드 아님)
# 기본 백엔드는 ollama.default_embed_model(BGE-M3, 다국어 강세) — core/embedder.py get_embedder() 참고
embedding:
  model: "all-MiniLM-L6-v2"
  dimension: 384

# ── Ollama Models (dbma.py UI용) ─────────────────────
# [2026-08-25] 기본 생성 모델을 my-theology-bot-v2로 복원 — 2026-07-28에
# 베타 16GB 호환성 때문에 llama3.1:8b로 낮췄었으나(git blame 참고),
# 신학 시스템 프롬프트가 없는 llama3.1:8b가 근거 문서 없이도 공허하고
# 반복적인 답변을 생성하는 문제가 human-runtime-debugging 세션에서
# 확인됨(fresh-install 상태, "하나님의 공의" 질의). 8b 유지 시 답변
# 품질 저하가 베타 배포 자체의 신뢰도를 해친다고 판단해 품질을
# 우선하기로 결정 — 16GB급 기기 호환성은 이번 결정으로 포기함.
# 재도입하려면 GEN_MODEL_OPTIONS 기반 UI 모델 선택 또는 기기 메모리
# 감지 분기가 필요(core/config.py:240 GEN_MODEL_OPTIONS 참고).
ollama:
  default_embed_model: "bge-m3:latest"
  # [J6 전환, 2026-10-20] v3 → v4. 사용자 채점 결과 생성 모델을 교체했다 —
  # 대표 질의 24건 비교 채점에서 B(qwen3.8) 22건 · 무차 2건 · A(현행 70B) 0건.
  # 베이스가 llama3.3:70b Q4_K_M → qwen3.8:27b q8_0으로 바뀐다. 실측(J6):
  # 표식(지워진 글자) 35자 → 3자, 오염 이벤트 19 → 7, p90 141.0s → 69.4s,
  # 실답변 출처 표기 9/11 → 5/5. 유보 규율은 약해지지 않았다(현행이 유보한
  # 질의에 후보가 추가로 답한 것 0건). 정의는 Modelfile.theology-gen-v4.
  # **v4는 thinking 모델이라 아래 disable_thinking: true가 반드시 함께 켜져야
  # 한다** — 끄지 않으면 답변이 빈 문자열이 된다.
  # 롤백: 이 값을 "my-theology-bot-v3:latest"로 되돌린다(v3·v2 보존).
  #
  # [J6, 2026-10-18] v2 → v3. 차이는 SYSTEM 프롬프트 §4 하나다 — v2는 "설교
  # 대지 … 실제적인 예화와 적용점을 균형 있게 제안하세요"로 지시해 HQ 절대
  # 규칙(예화 생성 절대 금지, 2026-09-15)과 충돌했다. v3는 "자료에 실제로
  # 적혀 있는 적용점만, 예화는 지어내지 말 것"으로 바꿨다. 정의는
  # Modelfile.theology-gen에 있다(종전에는 Ollama 로컬 저장소에만 있었다).
  # 베이스·양자화·파라미터는 v2와 동일(llama3.3:70b Q4_K_M, 레이어 재사용).
  # 롤백: 이 값을 "my-theology-bot-v2:latest"로 되돌리면 된다(v2 보존됨).
  default_gen_model: "my-theology-bot-v4:latest"
  # [J6 전환] qwen3 계열 thinking 모델 대응. num_predict가 사고 과정에 전량
  # 소진되면 response가 빈 문자열로 돌아온다(실측: thinking 3,850자 /
  # response 0자 / done_reason="length"). 생성 경로 4곳(스트리밍·단발 생성·
  # 설교 개요·대지 확장)이 이 값을 따른다. llama 계열로 롤백하면 false로.
  disable_thinking: true
  embed_model_options:
    - "bge-m3:latest"
    - "nomic-embed-text"
    - "mxbai-embed-large"
  gen_model_options:
    - "my-theology-bot-v4:latest"
    - "my-theology-bot-v3:latest"   # 롤백용(llama3.3:70b Q4_K_M 계열)
    - "my-theology-bot-v2:latest"   # 롤백용(SYSTEM §4 예화 지시 포함, 사용 비권장)
    - "llama3.1:8b"
    - "llama3.2:3b"
    - "llama3:latest"

# ── Progress Tracking Defaults ─────────────────────────
progress_defaults:
  - area: "멀티 포맷 추출"
    progress: 75
    status: "DOING"
  - area: "텍스트 정제"
    progress: 60
    status: "DOING"
  - area: "청킹 전략"
    progress: 45
    status: "DOING"
  - area: "임베딩/인덱싱"
    progress: 50
    status: "DOING"
  - area: "평가 루프"
    progress: 35
    status: "DOING"
  - area: "로그/추적성"
    progress: 30
    status: "TODO"
  - area: "UI/탭 구조"
    progress: 25
    status: "TODO"
  - area: "문서화/운영"
    progress: 65
    status: "DOING"

# ── RAG Settings ───────────────────────────────────────
rag:
  min_length: 80
  max_noise: 70.0
  top_k: 4
  default_temperature: 0.2
  chunk_size: 1200
  chunk_overlap: 120
  # [ADR-034 / J2] LLM 근거 블록에 이어붙일 앞뒤 이웃 청크 수. 0이면 비활성.
  # 고정폭 청킹 탓에 청크의 31.1%가 문장 중간에서 끊기므로(실측 119,595건),
  # 이웃을 붙인 뒤 core/paragraph_context.py가 경계를 다듬어 "완성된 문단"으로
  # 만든다. 랭킹·스코어·citation·임베딩에는 영향 없음. 종전에는 이 키가
  # 파일에 없어 코드 기본값 1로 돌았다 — 값을 눈에 보이게 고정한다.
  context_window_neighbors: 1
  # [2026-09-04] Q&A·본문해설 생성(core/generation.py::GenerationService)의
  # Ollama 옵션. my-theology-bot-v2 가 저온 결정론 설정에서 같은 구절을
  # 반복하는 퇴행 루프(요한복음 1:10 해설 실측) 방지.
  repeat_penalty: 1.3
  # [J6 전환, 2026-10-20] 1024 → 2048. v4(qwen3.8)로 바꾼 뒤 실제 프롬프트
  # (근거 5건, 15,557자)에서 1024가 상한에 걸려 답변이 문장 중간에서 끊겼다:
  #   num_predict=1024 → 2,524자 · eval_count=1024 · done_reason="length"
  #                      끝: "…육체에서 난"   ← 중간 절단
  #   num_predict=2048 → 2,036자 · eval_count= 887 · done_reason="stop"
  #                      끝: "…이해할 것을 권고합니다."
  # 조건 ④(완결된 문장)에 직결된다. 설교 대지 확장은 이미 2048을 쓰고 있어
  # 두 경로의 값이 같아진다. 상한일 뿐이라 짧은 답변의 비용은 늘지 않는다.
  num_predict: 2048
  # [2026-09-15, S1-4] 설교 대지 확장(SermonDraftService)은 repeat_penalty는
  # 위 값을 공유하되, num_predict만 문단 길이에 맞춰 따로 둔다 — 1024는
  # 실측상 문장 중간에서 출력을 잘랐다(llama3.2:3b 테스트).
  sermon_num_predict: 2048

# ── UI Defaults ────────────────────────────────────────
ui:
  chunk_size: 1200
  chunk_overlap: 120
  use_ocr: false

# ── Maintenance (2026-08-24, 휴지통 자동 비우기) ────────
maintenance:
  trash_retention_days: 30

# ── Optional Modules (NAE-OPTIONAL-MODULE-PACKAGING-001) ─────
# DBMA Core는 이 섹션이 없거나 전부 disabled여도 완전히 정상 동작한다.
# 내부 코드 식별자는 "nae_pd"(NAE Public Theology Domain — Dagg/Hiscox 등
# 공개신학 TSU corpus)로, 제품 브랜드 "내서재"(scripts/install_nae_beta.command
# 가 설치하는 DBMA 앱 전체)와는 다른 대상이다 — 이름 혼동 방지를 위해
# 브랜드명이 아닌 내부 식별자만 여기 사용한다.
modules:
  nae_pd:
    enabled: false
    display_name: "NAE Public Theology Module"
    corpus_root: "NAE/corpus/tsu"
    manifest_dir: "NAE/pipeline/ingest/manifests"
    index_collection: "nae_tsu_v1"

# ── Workspace Reset (ADR-033) ──────────────────────────────
# 배포 전 튜닝용 티어드 리셋. scripts/reset_workspace.py 가 읽는다.
# 층위 B(protected_prefixes)에서 RAW/소스 6항목(data/RAW/, NAE/corpus/raw/,
# data/bible/, sermon_corpus/, data/sermon_corpus/, data/beta_corpus/)을
# 제거하는 수정은 ADR-033 Amendment 없이 금지 — 유틸리티가 기동 시 강제 복원한다.
reset:
  protected_prefixes:
    - data/RAW/
    - NAE/corpus/raw/
    - data/bible/
    - sermon_corpus/
    - data/sermon_corpus/
    - data/beta_corpus/
    - .git
    - core/
    - ui/
    - scripts/
    - tests/
    - docs/
    - NAE/pipeline/
    - NAE/authority/
    - NAE/governance/
    - config.yaml
    - .env
  tiers:
    T1:
      - "output/*"
      - "chroma_db/*"
      - "cache/*"
      - "NAE/corpus/embeddings/*"
      - "data/제련완성본/*_pdf.md"
      - "data/제련완성본/*_chunks.txt"
      - "data/제련완성본/*_chunks_meta.json"
      - "data/제련완성본/*_pdf_chunks*.json"
      - "data/normalized/*"
      - "data/processed/*"
      - "data/nae/*"
      - "data/inbox/*"
      - "reports/*"
      - "evidence/*"
    T2:
      - "NAE/corpus/tsu/*"
      - "NAE/corpus/manifests/*"
      - "NAE/corpus/quarantine/*"
      - "NAE/benchmark/*"
    # T3: 설계만 — 구현하지 않음 (HQ 결정 2026-09-07). scripts/reset_workspace.py 는 T3 거부.
  # 기본 빈 목록. HQ가 명시적으로 채우고 --drop-qdrant 를 줘야 drop.
  # 운영 인덱스(nae_tsu_v1/nae_bible_v1/nae_ref_v1)는 예외 케이스 (ADR-033 §4.4).
  qdrant_collection_whitelist: []
