<script>
        // Micro-interaction for the cards
        document.querySelectorAll('.scholar-card').forEach(card => {
            card.addEventListener('mouseenter', () => {
                const icon = card.querySelector('.material-symbols-outlined');
                icon.style.transition = 'transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                icon.style.transform = 'scale(1.15) rotate(-5deg)';
            });
            card.addEventListener('mouseleave', () => {
                const icon = card.querySelector('.material-symbols-outlined');
                icon.style.transform = 'scale(1) rotate(0deg)';
            });
        });

        // Subtle parallax effect on the illustration container
        window.addEventListener('mousemove', (e) => {
            const icons = document.querySelectorAll('.material-symbols-outlined.absolute');
            const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
            const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
            
            icons.forEach((icon, index) => {
                const depth = (index + 1) * 2;
                icon.style.transform = `translate(${moveX * depth}px, ${moveY * depth}px)`;
            });
        });
    </script>
