version: "3.9"

services:

  # =========================
  # VECTOR DATABASE (Qdrant)
  # =========================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: dbma_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  # =========================
  # WORKFLOW AUTOMATION (n8n)
  # =========================
  n8n:
    image: n8nio/n8n:latest
    container_name: dbma_n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

volumes:
  qdrant_storage:
  n8n_data:
