<title>G7 2차 채점</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Noto+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style id="app-style">
/* 레이아웃: 집계 바 → 규칙 → 채점 카드(답변 전문 + 3축) → 규칙적용 유보(접힘) */
:root{
  --paper:#eceee8; --paper-raised:#f7f8f4; --paper-sunk:#e3e6de;
  --ink:#22262a; --ink-dim:#5c625f; --ink-faint:#8b9089; --line:#d3d6cc;
  --accent:#2f4a63; --accent-strong:#1f3345; --accent-tint:#e2e9ee;
  --gold:#8a6a2e; --gold-tint:#f1e8d3;
  --pass:#3f7a52; --pass-tint:#e3efe4;
  --flag:#9c6b1f; --flag-tint:#f3ead4;
  --fail:#a3402f; --fail-tint:#f4e2de;
  --pending:#8b8d86; --pending-tint:#e7e7e1;
  --shadow:0 1px 2px rgba(30,34,30,.06),0 4px 14px rgba(30,34,30,.06);
  --focus:0 0 0 3px var(--accent-tint);
  --serif:"Song Myung","Apple SD Gothic Neo",serif;
  --sans:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#1b1e1f; --paper-raised:#232728; --paper-sunk:#151818;
    --ink:#e9e8e0; --ink-dim:#aeb2a8; --ink-faint:#787d76; --line:#3a3e39;
    --accent:#8fb3cf; --accent-strong:#bcd6e8; --accent-tint:#26333c;
    --gold:#d1a24f; --gold-tint:#33291a;
    --pass:#6fae82; --pass-tint:#1f2f22;
    --flag:#cf9a44; --flag-tint:#332916;
    --fail:#d97b68; --fail-tint:#332019;
    --pending:#8a8d84; --pending-tint:#282824;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1b1e1f; --paper-raised:#232728; --paper-sunk:#151818;
  --ink:#e9e8e0; --ink-dim:#aeb2a8; --ink-faint:#787d76; --line:#3a3e39;
  --accent:#8fb3cf; --accent-strong:#bcd6e8; --accent-tint:#26333c;
  --gold:#d1a24f; --gold-tint:#33291a;
  --pass:#6fae82; --pass-tint:#1f2f22;
  --flag:#cf9a44; --flag-tint:#332916;
  --fail:#d97b68; --fail-tint:#332019;
  --pending:#8a8d84; --pending-tint:#282824;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.62}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
h1,h2{font-family:var(--serif); font-weight:400; margin:0; text-wrap:balance}
.wrap{max-width:820px; margin:0 auto; padding-block:26px 90px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
.masthead{display:flex; flex-direction:column; gap:10px; margin-bottom:18px}
.masthead h1{font-size:26px; color:var(--accent-strong)}
.masthead .sub{color:var(--ink-dim); font-size:14px; max-width:66ch}
.statbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:6;
  background:var(--paper-raised); border:1px solid var(--line); border-radius:12px;
  box-shadow:var(--shadow); padding:13px 15px;
  display:flex; flex-wrap:wrap; align-items:center; gap:12px 18px}
.statbar .count{display:flex; align-items:baseline; gap:7px}
.statbar .count .n{font-family:var(--serif); font-size:25px; color:var(--accent-strong)}
.statbar .count .lbl{font-size:12.5px; color:var(--ink-dim)}
.pill-row{display:flex; gap:7px; flex-wrap:wrap; margin-left:auto}
.pill{display:inline-flex; align-items:center; gap:5px; border-radius:999px;
  padding:4px 10px; font-size:12.5px; font-weight:600}
.pill .n{font-family:var(--mono)}
.pill.pass{background:var(--pass-tint); color:var(--pass)}
.pill.flag{background:var(--flag-tint); color:var(--flag)}
.pill.fail{background:var(--fail-tint); color:var(--fail)}
.pill.pending{background:var(--pending-tint); color:var(--ink-dim)}
.btnrow{display:flex; gap:9px; width:100%; flex-wrap:wrap; align-items:center}
button.primary,button.ghost{font-family:var(--sans); font-size:13.5px; font-weight:600;
  border-radius:8px; padding:8px 14px; cursor:pointer; border:1px solid transparent}
button.primary{background:var(--accent); color:var(--paper-raised)}
button.primary:hover{filter:brightness(1.08)}
button.primary:disabled{opacity:.5; cursor:not-allowed}
button.ghost{background:transparent; color:var(--accent); border-color:var(--line)}
button.ghost:hover{background:var(--accent-tint)}
.savestate{font-size:12.5px; color:var(--ink-faint)}
.rules{border:1px solid var(--gold); border-left-width:4px; border-radius:10px;
  background:var(--gold-tint); color:var(--ink); padding:13px 15px;
  margin:18px 0 22px; font-size:13.5px}
.rules h2{font-size:15px; margin-bottom:6px}
.rules ul{margin:0; padding-left:18px}
.rules li+li{margin-top:4px}
.rules b{color:var(--accent-strong)}
.card{background:var(--paper-raised); border:1px solid var(--line);
  border-left:4px solid var(--pending); border-radius:10px; padding:15px 17px;
  margin-bottom:16px; box-shadow:var(--shadow)}
.card[data-verdict="pass"]{border-left-color:var(--pass)}
.card[data-verdict="flag"]{border-left-color:var(--flag)}
.card[data-verdict="fail"]{border-left-color:var(--fail)}
.card-top{display:flex; align-items:flex-start; gap:9px; margin-bottom:8px; flex-wrap:wrap}
.card-top .qid{font-family:var(--mono); font-size:12.5px; color:var(--ink-faint); padding-top:3px}
.card-top .qtext{font-weight:600; font-size:15px; flex:1; min-width:0}
.kind{font-size:11px; font-weight:700; letter-spacing:.04em; border-radius:5px;
  padding:2px 7px; background:var(--accent-tint); color:var(--accent-strong)}
.kind.partial{background:var(--gold-tint); color:var(--gold)}
.sig{display:flex; gap:5px; flex-wrap:wrap; margin-bottom:9px}
.sig span{font-size:11px; font-weight:600; border-radius:5px; padding:2px 6px;
  background:var(--paper-sunk); color:var(--ink-dim); font-family:var(--mono)}
.sig span.warn{background:var(--fail-tint); color:var(--fail)}
.sig span.ok{background:var(--pass-tint); color:var(--pass)}
.answer{font-size:13.8px; line-height:1.65; white-space:pre-wrap; overflow-wrap:anywhere;
  background:var(--paper); border:1px solid var(--line); border-radius:9px;
  padding:11px 13px; max-height:22em; overflow-y:auto}
.answer.open{max-height:none}
.more{margin-top:6px; font-size:12px; font-weight:600; color:var(--accent);
  background:none; border:none; padding:0; cursor:pointer}
.issues{margin-top:10px; border:1px solid var(--flag); border-left-width:3px;
  border-radius:8px; background:var(--flag-tint); padding:9px 11px; font-size:12.5px}
.issues b{color:var(--flag)}
.issues ul{margin:5px 0 0; padding-left:17px}
label.fieldlbl{display:block; font-size:11.5px; font-weight:600; color:var(--ink-dim);
  margin:13px 0 5px; text-transform:uppercase; letter-spacing:.04em}
.sliders{display:grid; grid-template-columns:repeat(3,1fr); gap:9px 18px}
.slider-row .top{display:flex; justify-content:space-between; font-size:12.5px;
  color:var(--ink-dim); margin-bottom:2px}
.slider-row .top .val{font-family:var(--mono); font-weight:600; color:var(--accent-strong)}
input[type=range]{width:100%; accent-color:var(--accent); height:18px}
.bottom-row{display:flex; align-items:flex-end; gap:13px; margin-top:12px; flex-wrap:wrap}
.bottom-row .notes-wrap{flex:1; min-width:200px}
textarea{width:100%; font-family:var(--sans); font-size:13.5px; color:var(--ink);
  background:var(--paper); border:1px solid var(--line); border-radius:8px;
  padding:9px 11px; resize:vertical; min-height:50px; line-height:1.55}
textarea:focus,select:focus,input:focus{outline:none; box-shadow:var(--focus); border-color:var(--accent)}
.verdict-wrap{display:flex; flex-direction:column; gap:4px}
select.verdict{font-family:var(--sans); font-weight:700; font-size:13px; padding:7px 10px;
  border-radius:8px; border:1px solid var(--line); background:var(--paper); color:var(--ink)}
.suggest{font-size:11.5px; color:var(--ink-faint)}
details.held{margin-top:26px; border:1px solid var(--line); border-radius:10px;
  background:var(--paper-raised); padding:12px 15px}
details.held summary{cursor:pointer; font-weight:600; font-size:14px; color:var(--accent-strong)}
details.held .hint{font-size:13px; color:var(--ink-dim); margin:8px 0 10px; max-width:64ch}
.held-row{display:flex; gap:9px; align-items:baseline; padding:7px 0;
  border-top:1px solid var(--line); font-size:13.5px; flex-wrap:wrap}
.held-row .qid{font-family:var(--mono); font-size:12.5px; color:var(--ink-faint)}
.held-row .q{flex:1; min-width:0}
.held-row .note{font-size:12px; color:var(--pass); background:var(--pass-tint);
  border-radius:5px; padding:2px 7px}
footer.page{margin-top:34px; padding-top:15px; border-top:1px solid var(--line);
  font-size:12px; color:var(--ink-faint)}
.toast{position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(18px + env(safe-area-inset-bottom,0px));
  background:var(--accent-strong); color:var(--paper-raised); font-size:13px; font-weight:600;
  padding:9px 16px; border-radius:999px; box-shadow:var(--shadow); opacity:0;
  pointer-events:none; transition:opacity .2s ease}
.toast.show{opacity:1}
@media (max-width:620px){
  .sliders{grid-template-columns:1fr}
  .statbar{flex-direction:column; align-items:stretch}
  .pill-row{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap" id="app"></div>
<script id="data-json" type="application/json">__DATA_JSON__</script>
<script id="app-logic">
(function(){
  "use strict";
  var SLIDERS = [
    {key:"sDoct",   label:"신학적 정합성"},
    {key:"sPastor", label:"목회적 유용성"},
    {key:"sLang",   label:"언어 완성도"}
  ];
  var LS_KEY = "nae-j7-round2-draft";

  var raw = {};
  try { raw = JSON.parse(document.getElementById("data-json").textContent||"{}"); } catch(e){ raw={}; }
  var ITEMS = raw.toScore || [], HELD = raw.held || [];

  function empty(){ return {sDoct:0, sPastor:0, sLang:0, notes:"", verdict:"pending"}; }
  var state = {scores:{}, updatedAt: raw.updatedAt || null};
  ITEMS.forEach(function(it){ state.scores[it.id] = Object.assign(empty(), (raw.scores||{})[it.id]||{}); });
  try {
    var d = JSON.parse(localStorage.getItem(LS_KEY)||"null");
    if (d && d.scores && (!state.updatedAt || (d.updatedAt||"") > state.updatedAt)) {
      ITEMS.forEach(function(it){ if(d.scores[it.id]) state.scores[it.id]=Object.assign(empty(), d.scores[it.id]); });
      state.restored = true;
    }
  } catch(e){}

  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function pad(n){ return (n<10?"0":"")+n; }
  function fmt(iso){ try{var d=new Date(iso);
    return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+pad(d.getHours())+":"+pad(d.getMinutes());
  }catch(e){return String(iso);} }

  function suggest(r){
    var v = SLIDERS.map(function(s){ return r[s.key]||0; });
    if (v.some(function(x){ return x===0; })) return null;
    var avg = v.reduce(function(a,b){return a+b;},0)/v.length;
    if (avg <= 2.25) return "fail";
    if (avg >= 4) return "pass";
    return "flag";
  }
  function counts(){
    var c={pass:0,flag:0,fail:0,pending:0};
    ITEMS.forEach(function(it){ var v=state.scores[it.id].verdict; c[v]=(c[v]||0)+1; });
    return c;
  }

  function statbar(){
    var c=counts(), done=c.pass+c.flag+c.fail;
    return '<div class="statbar">'+
      '<div class="count"><span class="n mono">'+done+' / '+ITEMS.length+'</span><span class="lbl">채점 완료</span></div>'+
      '<div class="pill-row">'+
        '<span class="pill pass">PASS <span class="n">'+c.pass+'</span></span>'+
        '<span class="pill flag">FLAG <span class="n">'+c.flag+'</span></span>'+
        '<span class="pill fail">FAIL <span class="n">'+c.fail+'</span></span>'+
        '<span class="pill pending">대기 <span class="n">'+c.pending+'</span></span>'+
      '</div>'+
      '<div class="btnrow">'+
        '<button class="primary" id="btn-save">진행 상황 저장</button>'+
        '<button class="ghost" id="btn-copy">요약 마크다운 복사</button>'+
        '<span class="savestate" id="savestate">'+
          (state.updatedAt ? "마지막 저장: "+fmt(state.updatedAt) : "아직 저장 안 됨")+
          (state.restored ? " · 이 브라우저의 임시 입력을 복구했습니다" : "")+
        '</span>'+
      '</div></div>';
  }

  function rules(){
    return '<div class="rules"><h2>이 화면에서 보실 것</h2><ul>'+
      '<li><b>자료 충실성은 빠져 있습니다</b> — 기계가 이미 쟀습니다(인용 60건 중 이슈 4건, 질의 3/24). '+
        '원문을 대조하실 필요가 없고, 이슈가 있는 질의에는 아래에 그 문장을 붙여 두었습니다.</li>'+
      '<li>남은 세 축은 <b>답변만 읽으면 판단할 수 있는 것</b>입니다: 신학적 정합성 · 목회적 유용성 · 언어 완성도.</li>'+
      '<li><b>PASS</b> 평균 ≥ 4 · <b>FLAG</b> 일부 미흡하나 치명적이지 않음 · '+
        '<b>FAIL</b> 자료에 없는 사실 단정, 전통 구분 없이 섞음, 다수 2 이하.</li>'+
      '<li><span class="kind partial">부분 유보</span> 표시는 "자료에 없다"고 범위를 먼저 밝힌 뒤 '+
        '<b>자료에 있는 만큼은 답한</b> 경우입니다. 주장이 있으므로 채점 대상입니다.</li>'+
      '<li>순수 유보 13건은 "정직 유보 → 수동 PASS" 규칙을 적용해 맨 아래에 접어 두었습니다 — 확인만 하시면 됩니다.</li>'+
      '</ul></div>';
  }

  function sig(it){
    var out=[];
    out.push('<span>'+it.chars.toLocaleString()+'자</span>');
    out.push('<span>'+it.secs+'s</span>');
    out.push(it.src?'<span class="ok">출처 표기</span>':'<span class="warn">출처 없음</span>');
    out.push(it.citations?'<span>인용 '+it.citations+'건</span>':'');
    if(it.issues.length) out.push('<span class="warn">인용 이슈 '+it.issues.length+'</span>');
    if(it.markers) out.push('<span class="warn">표식 '+it.markers+'자</span>');
    if(it.events) out.push('<span class="warn">오염 '+it.events+'회</span>');
    return '<div class="sig">'+out.join("")+'</div>';
  }

  function card(it){
    var r = state.scores[it.id], sg = suggest(r);
    return '<div class="card" data-id="'+it.id+'" data-verdict="'+r.verdict+'">'+
      '<div class="card-top"><span class="qid">'+it.id+'</span>'+
        '<span class="qtext">'+esc(it.q)+'</span>'+
        '<span class="kind'+(it.kind==="partial"?" partial":"")+'">'+
          (it.kind==="partial"?"부분 유보":"실답변")+' · '+esc(it.catName)+'</span></div>'+
      sig(it)+
      '<div class="answer" id="ans-'+it.id+'">'+esc(it.text)+'</div>'+
      ((it.text||"").length>900?'<button class="more" data-more="ans-'+it.id+'">전문 펼치기</button>':'')+
      (it.issues.length?'<div class="issues"><b>인용 대조에서 확인하지 못한 표현</b><ul>'+
        it.issues.map(function(m){ return '<li>'+esc(m)+'</li>'; }).join("")+'</ul></div>':'')+
      '<label class="fieldlbl">채점 (0 = 아직 안 매김)</label>'+
      '<div class="sliders">'+SLIDERS.map(function(s){
        return '<div class="slider-row"><div class="top"><span>'+s.label+'</span>'+
          '<span class="val mono" data-val-for="'+it.id+'.'+s.key+'">'+(r[s.key]||"–")+'</span></div>'+
          '<input type="range" min="0" max="5" step="1" value="'+(r[s.key]||0)+'" '+
          'data-field="'+s.key+'" data-id="'+it.id+'" aria-label="'+s.label+'"></div>';
      }).join("")+'</div>'+
      '<div class="bottom-row"><div class="notes-wrap"><label class="fieldlbl">메모</label>'+
        '<textarea data-field="notes" data-id="'+it.id+'" placeholder="문제 문장 인용 등">'+esc(r.notes)+'</textarea></div>'+
        '<div class="verdict-wrap"><label class="fieldlbl">판정</label>'+
        '<select class="verdict" data-field="verdict" data-id="'+it.id+'">'+
          ['pending','pass','flag','fail'].map(function(v){
            var l={pending:"대기",pass:"PASS",flag:"FLAG",fail:"FAIL"}[v];
            return '<option value="'+v+'"'+(r.verdict===v?" selected":"")+'>'+l+'</option>';
          }).join("")+'</select>'+
          (sg?'<span class="suggest">제안: '+sg.toUpperCase()+'</span>':'')+
      '</div></div></div>';
  }

  function heldBlock(){
    return '<details class="held"><summary>규칙 적용 — 정직 유보 '+HELD.length+'건 (수동 PASS)</summary>'+
      '<div class="hint">자료에 없다고 밝히고 거기서 멈춘 답변입니다. 승인된 규칙("정직 유보는 '+
      '슬라이더를 무시하고 수동 PASS")을 그대로 적용했습니다 — 판단이 아니라 규칙 적용이라 미리 기록했습니다. '+
      '다르게 보시는 항목이 있으면 메모로 알려 주십시오.</div>'+
      HELD.map(function(h){
        return '<div class="held-row"><span class="qid">'+h.id+'</span>'+
          '<span class="q">'+esc(h.q)+'</span>'+
          (h.holdNote?'<span class="note">'+esc(h.holdNote)+'</span>':'')+
          '<span class="note">PASS</span></div>';
      }).join("")+'</details>';
  }

  function render(){
    document.getElementById("app").innerHTML =
      '<div class="masthead"><h1>G7 2차 채점</h1>'+
      '<div class="sub">배포 게이트에 남은 사람 판단만 모았습니다. 채택 모델(qwen3.8)의 답변 '+
      ITEMS.length+'건 — 실답변 '+ITEMS.filter(function(i){return i.kind==="full";}).length+
      '건과 부분 유보 '+ITEMS.filter(function(i){return i.kind==="partial";}).length+'건입니다.</div></div>'+
      statbar()+rules()+ITEMS.map(card).join("")+heldBlock()+
      '<footer class="page">축·판정식은 docs/NAE_GOLD_QUERY_SET_P0_5_001.md, 답변 원문은 '+
      'docs/NAE_ANSWER_QUALITY_J6_MODEL_AB_002_candidates.json, 인용 대조는 '+
      'docs/NAE_ANSWER_QUALITY_J7_CITATION_CHECK_001.json과 대응합니다.</footer>'+
      '<div class="toast" id="toast"></div>';
    wire();
  }

  function toast(m){ var t=document.getElementById("toast"); if(!t)return;
    t.textContent=m; t.classList.add("show"); setTimeout(function(){t.classList.remove("show");},1900); }
  function saveDraft(){ try{ localStorage.setItem(LS_KEY,
    JSON.stringify({scores:state.scores, updatedAt:new Date().toISOString()})); }catch(e){} }

  function refresh(id){
    var r=state.scores[id], c=document.querySelector('.card[data-id="'+id+'"]');
    if(c){
      c.setAttribute("data-verdict", r.verdict);
      var sg=suggest(r), el=c.querySelector(".suggest");
      if(sg && el) el.textContent="제안: "+sg.toUpperCase();
      else if(sg && !el){ var w=c.querySelector(".verdict-wrap");
        if(w){var s=document.createElement("span"); s.className="suggest";
          s.textContent="제안: "+sg.toUpperCase(); w.appendChild(s);} }
    }
    var sb=document.querySelector(".statbar"); if(sb) sb.outerHTML=statbar();
    wireChrome();
  }
  function wireChrome(){
    var s=document.getElementById("btn-save"); if(s) s.addEventListener("click", onSave);
    var c=document.getElementById("btn-copy"); if(c) c.addEventListener("click", onCopy);
  }
  function wire(){
    wireChrome();
    document.querySelectorAll("[data-field][data-id]").forEach(function(el){
      el.addEventListener("input", function(){
        var id=el.getAttribute("data-id"), f=el.getAttribute("data-field"), r=state.scores[id];
        if(el.type==="range"){ r[f]=parseInt(el.value,10);
          var lb=document.querySelector('[data-val-for="'+id+'.'+f+'"]'); if(lb) lb.textContent=r[f];
        } else r[f]=el.value;
        saveDraft();
        if(f!=="notes") refresh(id);
      });
    });
    document.querySelectorAll("[data-more]").forEach(function(b){
      b.addEventListener("click", function(){
        var box=document.getElementById(b.getAttribute("data-more")); if(!box)return;
        b.textContent = box.classList.toggle("open") ? "접기" : "전문 펼치기";
      });
    });
  }

  function summary(){
    var c=counts(), L=[];
    L.push("# G7 2차 채점 요약 ("+new Date().toISOString().slice(0,10)+")");
    L.push("");
    L.push("채점 대상 "+ITEMS.length+"건: PASS "+c.pass+" · FLAG "+c.flag+" · FAIL "+c.fail+" · 대기 "+c.pending);
    L.push("규칙 적용(정직 유보 수동 PASS): "+HELD.length+"건 — "+HELD.map(function(h){return h.id;}).join(", "));
    L.push("");
    L.push("| ID | 구분 | 정합 | 유용 | 언어 | 판정 | 메모 |");
    L.push("|---|---|---|---|---|---|---|");
    ITEMS.forEach(function(it){
      var r=state.scores[it.id];
      L.push("| "+it.id+" | "+(it.kind==="partial"?"부분유보":"실답변")+" | "+
        (r.sDoct||"-")+" | "+(r.sPastor||"-")+" | "+(r.sLang||"-")+" | "+
        r.verdict.toUpperCase()+" | "+String(r.notes||"").replace(/\n/g," ").replace(/\|/g,"/")+" |");
    });
    return L.join("\n");
  }
  function onCopy(){
    var t=summary();
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(function(){toast("요약을 클립보드에 복사했습니다");})
        .catch(function(){ fallback(t); });
    } else fallback(t);
  }
  function fallback(t){
    var ta=document.createElement("textarea"); ta.value=t; ta.setAttribute("readonly","");
    ta.style.position="fixed"; ta.style.left="8px"; ta.style.right="8px";
    ta.style.bottom="60px"; ta.style.height="38vh"; ta.style.zIndex="20";
    document.body.appendChild(ta); ta.focus(); ta.select();
    toast("복사가 막혀 있습니다 — 선택된 텍스트를 직접 복사하세요");
  }

  function buildDocument(){
    var css=document.getElementById("app-style").textContent;
    var logic=document.getElementById("app-logic").textContent;
    var blob=JSON.stringify({toScore:ITEMS, held:HELD, scores:state.scores,
      updatedAt:state.updatedAt}).replace(/<\//g,"<\\/");
    return '<!doctype html><html><head><meta charset=utf8>'+
      '<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">'+
      '<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);'+
      'padding-bottom:env(safe-area-inset-bottom,0px)}'+
      'body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}'+
      'img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}'+
      '</style></head><body>'+
      '<title>G7 2차 채점</title>\n'+
      '<meta name="claude:viewport-fit-sides" content="cover">\n'+
      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Noto+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">\n'+
      '<style id="app-style">'+css+'</style>\n'+
      '<div class="wrap" id="app"></div>\n'+
      '<script id="data-json" type="application/json">'+blob+'<\/script>\n'+
      '<script id="app-logic">'+logic+'<\/script>\n'+
      '</body></html>';
  }

  function onSave(){
    var b=document.getElementById("btn-save");
    if(b){ b.disabled=true; b.textContent="저장 중…"; }
    function done(){ var x=document.getElementById("btn-save");
      if(x){ x.disabled=false; x.textContent="진행 상황 저장"; } }
    var prev=state.updatedAt;
    state.updatedAt=new Date().toISOString();
    if(!(window.claude && window.claude.use)){
      state.updatedAt=prev; toast("이 보기에서는 저장할 수 없습니다"); done(); return;
    }
    window.claude.use("artifact").then(function(a){
      if(!a){ state.updatedAt=prev; toast("이 보기에서는 저장할 수 없습니다 (읽기 전용)"); done(); return; }
      return a.publish(buildDocument()).then(function(){
        saveDraft(); toast("저장됨 — 열려 있는 모든 보기가 이 버전으로 갱신됩니다");
      }).catch(function(err){
        state.updatedAt=prev;
        toast((err&&err.code)==="conflict" ? "다른 곳에서 먼저 저장됐습니다 — 새 버전으로 바뀝니다"
          : "저장 실패 — 임시 입력은 이 브라우저에 남아 있습니다");
      });
    }).catch(function(){ state.updatedAt=prev;
      toast("저장 실패 — 임시 입력은 이 브라우저에 남아 있습니다"); }).then(done, done);
  }

  render();
})();
</script>
